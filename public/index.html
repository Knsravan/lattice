<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0d12'/%3E%3Cg fill='%235b6b8c'%3E%3Ccircle cx='4' cy='4' r='1.3'/%3E%3Ccircle cx='12' cy='4' r='1.3'/%3E%3Ccircle cx='4' cy='12' r='1.3'/%3E%3Ccircle cx='12' cy='12' r='1.3'/%3E%3C/g%3E%3Ccircle cx='8' cy='8' r='2' fill='%23ffb454'/%3E%3C/svg%3E">
<title>Lattice — the math replacing the internet's locks</title>
<meta name="description" content="An explorable explanation of lattice-based post-quantum cryptography (Kyber / ML-KEM). Drag, throw, attack, encrypt.">
<meta property="og:title" content="Lattice">
<meta property="og:description" content="An explorable explanation of the math that is replacing the internet's locks.">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --panel: #11141c;
    --line: #1e2330;
    --ink: #e8ecf1;
    --muted: #8a94a6;
    --dot: #5b6b8c;
    --ball: #ffb454;     /* the ball / the ciphertext */
    --secret: #3ddc97;   /* the secret / good basis */
    --attacker: #ff5c7a; /* the attacker / bad basis */
    --maxw: 1080px;
    --glass: rgba(17,20,28,.84); /* panels over the 3D town */
    --card: rgba(13,16,24,.82);  /* text cards over the town */
    --step-bg: rgba(11,13,18,.72); --step-active-bg: rgba(17,20,28,.9);
    --prose: #c7cedb; --snd-bg: rgba(17,20,28,.92); --vignette: rgba(11,13,18,.7);
    --scrim-top: rgba(11,13,18,.35); --scrim-bottom: rgba(11,13,18,.55);
  }
  /* light theme = the town by day (src/ui/theme.ts sets data-theme). Diagrams keep their dark screens in both themes. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #e6edf5; --panel: #ffffff; --line: rgba(22,32,46,.16); --ink: #15202e; --muted: #4a576b;
    --ball: #b0620a; --secret: #0e7a53; --attacker: #bd2b4a;
    --card: rgba(255,255,255,.84); --step-bg: rgba(255,255,255,.78); --step-active-bg: rgba(255,255,255,.94);
    --prose: #2b384a; --snd-bg: rgba(255,255,255,.88); --vignette: rgba(230,237,245,.45);
    --scrim-top: rgba(230,237,245,.18); --scrim-bottom: rgba(230,237,245,.3);
  }
  .story-figure, .stage, .chart-panel, .kpanel {
    --bg: #0b0d12; --panel: #11141c; --glass: rgba(17,20,28,.93); --line: #1e2330; --ink: #e8ecf1; --muted: #8a94a6;
    --ball: #ffb454; --secret: #3ddc97; --attacker: #ff5c7a; --prose: #c7cedb; color: var(--ink);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  /* no scrollbars anywhere: the page scrolls with its own feel (src/ui/smooth.ts) and shows a progress line instead */
  html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; width: 0; height: 0; }

  /* the 3D backdrop behind everything (src/ui/backdrop.ts) */
  .backdrop { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 1.6s ease; }
  .backdrop.on { opacity: 1; }
  /* real footage behind the page (src/ui/footage.ts): one clip per chapter, cross-fading; a soft scrim keeps text readable */
  .footage { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; background: var(--bg); }
  .footage.on { opacity: 1; }
  .footage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  .footage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--scrim-top), var(--scrim-bottom)); }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse 120% 90% at 50% 50%, transparent 40%, var(--vignette) 100%); }
  .progress { position: fixed; left: 0; top: 0; width: 100%; height: 2px; z-index: 30; transform-origin: 0 50%; transform: scaleX(0); pointer-events: none;
    background: linear-gradient(90deg, var(--secret), var(--ball) 55%, var(--attacker)); box-shadow: 0 0 10px rgba(255,180,84,.55); }

  /* scroll reveal (src/ui/reveal.ts): each element appears once, in its own way */
  .reveal-ready [data-reveal] { transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.16,.8,.2,1), filter .9s ease;
    transition-delay: calc(var(--i, 0) * 110ms); }
  .reveal-ready [data-reveal]:not(.in) { opacity: 0; }
  .reveal-ready [data-reveal=rise]:not(.in) { transform: translateY(26px); }
  .reveal-ready [data-reveal=side]:not(.in) { transform: translateX(-34px); }
  .reveal-ready [data-reveal=zoom]:not(.in) { transform: perspective(900px) translateY(40px) rotateX(8deg) scale(.94); }
  .reveal-ready [data-reveal=words]:not(.in) { opacity: 1; }
  [data-reveal=words] .word { display: inline-block; }
  .reveal-ready [data-reveal=words] .word { transition: opacity .8s ease, transform 1s cubic-bezier(.16,.8,.2,1), filter .8s ease; transition-delay: calc(var(--w, 0) * 90ms + 80ms); }
  .reveal-ready [data-reveal=words]:not(.in) .word { opacity: 0; transform: translateY(.55em) rotate(2deg); }
  body {
    margin: 0; background: var(--bg); overscroll-behavior-y: none; color: var(--ink);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--secret); }
  body { overflow-x: clip; } /* the hero background is 100vw wide; clip (not hidden) keeps sticky prose working */
  #app { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; position: relative; }

  .hero { min-height: 92vh; display: flex; flex-direction: column; justify-content: center; padding: 8vh 0 6vh; max-width: 680px; }
  .hero > :not(.hero-bg) { position: relative; z-index: 1; }
  .hero > * { text-shadow: 0 0 18px var(--bg), 0 0 8px var(--bg), 0 0 3px var(--bg); } /* readable over the 3D lattice */
  .hero-bg {
    position: absolute; top: 0; left: 50%; width: 100vw; transform: translateX(-50%); z-index: 0; pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 55% 75% at 72% 50%, #000 0%, rgba(0,0,0,.45) 60%, transparent 100%);
    mask-image: radial-gradient(ellipse 55% 75% at 72% 50%, #000 0%, rgba(0,0,0,.45) 60%, transparent 100%);
  }
  .hero h1 { font-size: clamp(44px, 8vw, 84px); letter-spacing: .02em; margin: 0 0 .2em; font-weight: 700; line-height: 1; }
  .tagline { font-size: clamp(19px, 2.6vw, 24px); color: var(--muted); margin: 0 0 1.4em; }
  .intro { margin: 0 0 1em; }
  .hero-text { max-width: 600px; padding: 20px 24px 18px; margin-left: -24px; border-radius: 18px; background: var(--card); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 24px 60px -30px rgba(0,0,0,.5); }
  .hero-text .scroll-hint { margin-top: .6em; }
  @media (max-width: 820px) { .hero-text { margin-left: 0; padding: 16px 18px 14px; } }
  .scroll-hint { display: inline-block; margin-top: 1.6em; color: var(--muted); text-decoration: none; font-size: 15px; }
  .scroll-hint:hover { color: var(--ink); }

  /* scroll-story chapters: sticky picture, short steps scrolling past */
  .chapter { padding: 12vh 0 0; border-top: 1px solid var(--line); }
  .chapter-head { max-width: 680px; width: fit-content; padding: 14px 20px 6px; border-radius: 14px; background: var(--card); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .chapter-head h2, .scene h2 { font-size: clamp(28px, 4vw, 40px); margin: .2em 0 .6em; line-height: 1.1; }
  .story { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 40px; }
  .story-figure { grid-column: 2; grid-row: 1; align-self: start; position: sticky; top: 8vh; height: 84vh; background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 30px 80px -40px rgba(0,0,0,.8); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .story-canvas { display: block; width: 100%; height: 100%; }
  .story-steps { grid-column: 1; grid-row: 1; padding: 34vh 0 44vh; }
  .story-step { min-height: 72vh; display: flex; align-items: center; }
  .story-step p { margin: 0; font-size: 19px; line-height: 1.55; color: var(--muted); padding: 16px 18px; border-left: 3px solid var(--line); border-radius: 4px; transition: color .35s, border-color .35s, opacity .35s, background .35s; opacity: .8; background: var(--step-bg); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .story-step.active p { color: var(--ink); opacity: 1; border-left-color: var(--ball); background: var(--step-active-bg); box-shadow: 0 10px 40px -18px rgba(255,180,84,.35); }
  .scene { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 36px; align-items: start; padding: 10vh 0; border-top: 1px solid var(--line); }
  .kicker { color: var(--secret); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .prose p { margin: 0 0 .9em; color: var(--prose); font-size: 16px; }
  .prose { position: sticky; top: 40px; padding: 16px 18px 6px; border-radius: 14px; background: var(--card); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

  .stage-wrap { min-width: 0; padding: 14px; border-radius: 16px; background: var(--card); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .stage { position: relative; background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; }
  .scene-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .readout {
    position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 8px 12px; border-radius: 8px;
    background: rgba(11,13,18,.72); backdrop-filter: blur(6px); color: var(--muted); font-size: 14px;
    font-variant-numeric: tabular-nums; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .readout.warn { color: var(--ball); }
  .controls { display: flex; gap: 18px; align-items: center; margin-top: 12px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
  .controls label { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn:focus-visible, .seg:focus-visible, .linklike:focus-visible, .dots a:focus-visible, .scroll-hint:focus-visible,
  input:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }

  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg { background: transparent; color: var(--muted); border: 0; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .seg.active:first-child { background: rgba(61,220,151,.16); color: var(--secret); }
  .seg.active:last-child { background: rgba(255,92,122,.16); color: var(--attacker); }
  .tally { display: inline-flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .sliderlabel { display: inline-flex; align-items: center; gap: 8px; }
  .sliderlabel input[type=range] { width: 140px; accent-color: var(--ball); }
  .mono { font-variant-numeric: tabular-nums; min-width: 2.6em; color: var(--ball); }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); }
  .pill.good { color: var(--secret); } .pill.bad { color: var(--attacker); }
  .snd { position: fixed; left: 14px; bottom: 14px; z-index: 20; display: flex; gap: 6px; flex-wrap: wrap; }
  .snd-btn { background: var(--snd-bg); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; backdrop-filter: blur(6px); }
  .snd-btn[aria-pressed=true] { border-color: var(--ball); color: var(--ball); }
  .snd-btn:disabled { opacity: .5; cursor: default; }
  .snd-btn:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .dims .seg.active, .dims .seg.active:first-child, .dims .seg.active:last-child { background: var(--line); color: var(--ink); }
  .chart-panel { margin-top: 14px; background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; }
  .chart-canvas { display: block; width: 100%; height: 230px; }
  .chart-controls { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .chart-choice { display: inline-flex; align-items: center; gap: 8px; }
  .chart-choice .seg { padding: 4px 10px; font-size: 13px; }
  .chart-status { color: var(--muted); font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stage.short { aspect-ratio: 16 / 9; }
  .msg-row { display: flex; gap: 10px; align-items: center; margin: 14px 0 4px; color: var(--muted); font-size: 14px; }
  .msg-input { flex: 1; min-width: 0; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 15px; }
  .msg-input:focus { outline: none; border-color: var(--ball); }
  .kpanel { margin-top: 12px; background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .khead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .khead h3 { margin: 0; font-size: 16px; flex: 1 0 auto; }
  .linklike { background: none; border: 0; padding: 0; color: var(--secret); font: inherit; font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .krow { display: grid; grid-template-columns: minmax(96px, 180px) 1fr; gap: 10px; align-items: center; padding: 2px 0; font-size: 13px; }
  .klabel { color: var(--muted); }
  .kcells { display: grid; grid-template-columns: repeat(8, minmax(0, 2.4em)); gap: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .kc { text-align: right; animation: kfade .45s ease-out both; }
  .ktext { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ktext.wrap { word-break: break-all; }
  .fadein { animation: kfade .45s ease-out both; }
  .kwait { color: var(--muted); font-size: 14px; margin: 4px 0; animation: kfade .45s ease-out both; }
  .secret { color: var(--secret); } .public { color: var(--attacker); } .ball { color: var(--ball); } .muted { color: var(--muted); } .ink { color: var(--ink); }
  .qpanel h3 { margin: 0 0 10px; font-size: 16px; }
  .qcards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .qcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .qcard h4 { margin: 0 0 6px; font-size: 14px; color: var(--ink); }
  .qcard p { margin: 0 0 8px; font-size: 13px; line-height: 1.5; color: var(--prose); }
  .qcard .qverdict { margin: 0; font-weight: 600; }
  .qcard .qverdict.public { color: var(--attacker); } .qcard .qverdict.secret { color: var(--secret); }
  @media (max-width: 520px) { .qcards { grid-template-columns: 1fr; } }
  .kscale-intro, .kscale-note { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .kscale-note { margin: 12px 0 0; }
  .sbar-label { font-size: 13px; color: var(--ink); margin: 10px 0 4px; }
  .sbar-row { display: grid; grid-template-columns: 92px 1fr 104px; gap: 10px; align-items: center; font-size: 12px; padding: 2px 0; }
  .sbar-who { color: var(--muted); }
  .sbar-track { height: 10px; border-radius: 5px; background: rgba(138,148,166,.08); overflow: hidden; }
  .sbar { display: block; height: 100%; border-radius: 5px; background: currentColor; transform-origin: left; transform: scaleX(0); }
  .kscale.shown .sbar { animation: kgrow .9s cubic-bezier(.2,.7,.2,1) both; transform: none; }
  .sbar-num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  @keyframes kgrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .clock-canvas { display: block; width: 100%; max-width: 260px; height: 210px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
  }
  @keyframes kfade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (max-width: 520px) { .readout { white-space: normal; font-size: 13px; left: 8px; right: 8px; bottom: 8px; padding: 6px 10px; } }
  @media (max-width: 520px) { .krow { grid-template-columns: 1fr; gap: 2px; } }
  .placeholder { display: grid; place-items: center; aspect-ratio: 4/3; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
  .scene.soon .prose p { color: var(--muted); }
  .scene.soon .kicker { color: var(--muted); }

  footer .credits { margin: 10px 0 0; font-size: 12px; }
  footer { padding: 40px 20px 60px; margin-bottom: 30px; border-radius: 0 0 14px 14px; background: var(--card); color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }

  .dots { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
  .dots a { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; transition: background .2s, transform .2s; }
  .dots a.active { background: var(--secret); transform: scale(1.4); }

  @media (max-width: 820px) {
    .scene { grid-template-columns: 1fr; gap: 18px; padding: 8vh 0; }
    .chapter { padding-top: 8vh; }
    .story { display: block; }
    .story-figure { position: sticky; top: 0; height: 50vh; z-index: 2; margin: 0 -20px; border-radius: 0 0 14px 14px; border-top: 0; background: var(--panel); -webkit-backdrop-filter: none; backdrop-filter: none; } /* solid: the steps slide under it */
    .story-steps { position: relative; z-index: 1; padding: 6vh 0 34vh; }
    .story-step { min-height: 62vh; align-items: flex-start; padding-top: 4vh; }
    .story-step p { font-size: 17px; background: var(--glass); opacity: .6; }
    .story-step.active p { background: var(--panel); }
    .prose { position: static; }
    .dots { display: none; }
    .snd { left: auto; right: 8px; bottom: auto; top: 8px; }
    .snd-btn { padding: 6px 9px; font-size: 16px; }
    .snd-txt { display: none; }
    .hero { min-height: 70vh; }
    .hero-bg {
      -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 62%, rgba(0,0,0,.55) 0%, rgba(0,0,0,.2) 60%, transparent 100%);
      mask-image: radial-gradient(ellipse 80% 55% at 50% 62%, rgba(0,0,0,.55) 0%, rgba(0,0,0,.2) 60%, transparent 100%);
    }
  }
</style>
</head>
