<style>
  :root {
    color-scheme: dark;
    --bg: #05070d;       /* a dark studio behind the glass (src/ui/signal.ts) */
    --panel: #11141c;

    --rim: rgba(255,255,255,.3); --rim-lo: rgba(255,255,255,.05); --hi: rgba(255,255,255,.28); --sheen: rgba(255,255,255,.13); --shadow: rgba(0,0,0,.5);
    --step-bg: rgba(255,255,255,.04); --step-active-bg: rgba(255,255,255,.085);
    --prose: #c7cedb; --vignette: rgba(5,7,13,.55);
  }
  .story-figure, .stage, .chart-panel, .kpanel {
    --bg: #0b0d12; --panel: #11141c; --glass: rgba(8,11,18,.6); --line: rgba(255,255,255,.1); --ink: #e8ecf1; --muted: #8a94a6;
    --ball: #ffb454; --secret: #3ddc97; --attacker: #ff5c7a; --prose: #c7cedb; color: var(--ink);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  /* no scrollbars anywhere: the page scrolls with its own feel (src/ui/smooth.ts) and shows a progress line instead */
  html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; width: 0; height: 0; }

  /* the 3D stage behind everything (src/ui/signal.ts) */
  .backdrop { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 1.6s ease; }
  .backdrop.on { opacity: 1; }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse 120% 90% at 50% 50%, transparent 40%, var(--vignette) 100%); }
  .progress { position: fixed; left: 0; top: 0; width: 100%; height: 2px; z-index: 30; transform-origin: 0 50%; transform: scaleX(0); pointer-events: none;
    background: linear-gradient(90deg, var(--secret), var(--ball) 55%, var(--attacker)); box-shadow: 0 0 10px rgba(255,180,84,.55); }

  /* scroll reveal (src/ui/reveal.ts): each element appears once, in its own way */
  .reveal-ready [data-reveal] { transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.16,.8,.2,1), filter .9s ease;
    transition-delay: calc(var(--i, 0) * 110ms); }

  .reveal-ready [data-reveal=rise]:not(.in) { transform: translateY(26px); }
  .reveal-ready [data-reveal=side]:not(.in) { transform: translateX(-34px); }

  .reveal-ready [data-reveal=words]:not(.in) { opacity: 1; }

  [data-reveal=words] .word { white-space: nowrap; }
  [data-reveal=words] .char { display: inline-block; }
  .reveal-ready [data-reveal=words] .char { transition: opacity .8s ease, transform 1s cubic-bezier(.16,.9,.2,1), filter .8s ease; transition-delay: calc(var(--c, 0) * 24ms + 60ms); }
  .reveal-ready [data-reveal=words]:not(.in) .char { opacity: 0; transform: translateY(.6em) rotate(6deg); filter: blur(5px); }

  /* ---------- liquid glass ---------- */
  .hero-text, .chapter-head, .story-step p, .prose, .stage-wrap, footer, .snd, .dots {
    isolation: isolate; background: var(--card); -webkit-backdrop-filter: blur(18px) saturate(1.7); backdrop-filter: blur(18px) saturate(1.7);
    box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 1px var(--rim-lo), 0 18px 50px -24px var(--shadow); }
  .hero-text::before, .chapter-head::before, .story-step p::before, .prose::before, .stage-wrap::before, footer::before, .snd::before, .dots::before {

    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;

    background: linear-gradient(140deg, var(--rim), transparent 38%, transparent 62%, var(--rim-lo));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .hero-text, .chapter-head, .story-step p, .stage-wrap, footer { position: relative; }
  /* cards lean a little with the scroll speed (--glide, src/ui/glass.ts) */
  .chapter-head, .story-step p, .stage-wrap { transform: skewY(var(--glide, 0deg)); }
  .slot { aspect-ratio: 1; width: 100%; max-width: 440px; justify-self: center; }
  body {
    margin: 0; background: var(--bg); overscroll-behavior-y: none; color: var(--ink);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--secret); }

  .scroll-hint:hover { background: var(--step-active-bg); }

  /* scroll-story chapters: sticky picture, short steps scrolling past */

  .finale footer { margin: 0; }
  .chapter-head { max-width: 520px; width: fit-content; padding: 22px 28px 12px; border-radius: 26px; justify-self: start; }
  .chapter.flip .chapter-head { justify-self: end; }
  .chapter-head h2 { font-size: clamp(36px, 5.4vw, 60px); margin: .25em 0 .45em; line-height: 1; letter-spacing: -.02em; font-weight: 800; }
  .scene h2 { font-size: clamp(28px, 4vw, 40px); margin: .2em 0 .6em; line-height: 1.1; letter-spacing: -.01em; }
  .story { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 40px; }
  /* the diagrams sit on panes of dark glass: the 3D stage shows through, blurred, with a faint grid of light and a bright rim */
  .story-figure, .stage { background: radial-gradient(120% 90% at 20% 0%, rgba(127,180,255,.07), transparent 55%), var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 60px rgba(127,180,255,.04), 0 30px 80px -40px rgba(0,0,0,.8); }
  .story-figure { grid-column: 2; grid-row: 1; align-self: start; position: sticky; top: 8vh; height: 84vh; border-radius: 22px; overflow: hidden; }
  .story-canvas { display: block; width: 100%; height: 100%; }
  .story-steps { grid-column: 1; grid-row: 1; padding: 34vh 0 44vh; }
  .story-step { min-height: 72vh; display: flex; align-items: center; }
  .story-step p { margin: 0; font-size: 19px; line-height: 1.55; color: var(--muted); padding: 18px 22px; border-radius: 20px; transition: color .35s, opacity .35s, background .35s, box-shadow .35s; opacity: .78; background: var(--step-bg); }
  .story-step.active p { color: var(--ink); opacity: 1; background: var(--step-active-bg);
    box-shadow: inset 0 1px 0 var(--hi), inset 3px 0 0 var(--ball), 0 18px 50px -20px rgba(255,180,84,.3); }

  .kicker { color: var(--secret); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .prose p { margin: 0 0 .9em; color: var(--prose); font-size: 16px; }

  .stage-wrap { min-width: 0; padding: 14px; border-radius: 26px; }

  .scene-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .readout {
    position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 8px 12px; border-radius: 8px;
    background: rgba(12,16,26,.6); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); border-radius: 10px; color: var(--muted); font-size: 14px;

  }

  /* playground controls: small glass pills */
  .btn { background: rgba(255,255,255,.06); color: var(--ink); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer;

  .tally { display: inline-flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .mono { font-variant-numeric: tabular-nums; min-width: 2.6em; color: var(--ball); }

  .snd { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20; display: flex; gap: 4px; padding: 5px; border-radius: 999px; }
  .lens .snd { -webkit-backdrop-filter: blur(4px) saturate(1.8); backdrop-filter: url(#liquid) blur(4px) saturate(1.8); }
  .snd-btn { background: transparent; color: var(--ink); border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), background .3s, color .3s; }
  .snd-btn:hover { background: var(--card-strong); }
  .snd-btn[aria-pressed=true] { background: var(--card-strong); color: var(--ball); box-shadow: inset 0 1px 0 var(--hi); }
  .snd-btn:disabled { opacity: .5; cursor: default; }
  .snd-btn:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .dims .seg.active, .dims .seg.active:first-child, .dims .seg.active:last-child { background: var(--line); color: var(--ink); }
  .chart-panel { margin-top: 14px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5); border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); border-radius: 18px; padding: 10px 12px 12px; }
  .chart-canvas { display: block; width: 100%; height: 230px; }

  .chart-status { color: var(--muted); font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stage.short { aspect-ratio: 16 / 9; }
  .msg-row { display: flex; gap: 10px; align-items: center; margin: 14px 0 4px; color: var(--muted); font-size: 14px; }
  .msg-input { flex: 1; min-width: 0; background: rgba(255,255,255,.05); color: var(--ink); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 8px 12px; font: inherit; font-size: 15px; box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
  .msg-input:focus { outline: none; border-color: var(--ball); }
  .kpanel { margin-top: 12px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5); border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); border-radius: 18px; padding: 12px 14px; }
  .khead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .khead h3 { margin: 0; font-size: 16px; flex: 1 0 auto; }

  .secret { color: var(--secret); } .public { color: var(--attacker); } .ball { color: var(--ball); } .muted { color: var(--muted); } .ink { color: var(--ink); }

  @media (max-width: 520px) { .qcards { grid-template-columns: 1fr; } }
  .kscale-intro, .kscale-note { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

  .placeholder { display: grid; place-items: center; aspect-ratio: 4/3; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }

  footer .credits { margin: 10px 0 0; font-size: 12px; }

  .dots { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; padding: 12px 9px; border-radius: 999px; z-index: 20; }
  .dots a { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .45; display: block; transition: background .3s, transform .3s, opacity .3s, box-shadow .3s; }
